<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Paper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Serif:wght@400;700&display=swap">
<style>
  :root {
    --ink: #111;
    --muted: #666;
    --line: #111;
    --bg: #eceff3;
    --paper: #fff;
    --accent: #1f4fd8;
    --bar: #fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif", "Noto Sans Devanagari", Georgia, serif;
  }
  .bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 16px;
    background: var(--bar);
    border-bottom: 1px solid #d5d9e0;
    font-family: system-ui, sans-serif;
  }
  .bar button {
    font: inherit; font-size: 14px;
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid #c4c9d2; background: #fff; cursor: pointer;
  }
  .bar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bar .hint { color: var(--muted); font-size: 13px; margin-left: auto; }

  .paper {
    width: 210mm; min-height: 297mm;
    margin: 20px auto;
    padding: 14mm 16mm;
    background: var(--paper);
    box-shadow: 0 2px 14px rgba(0,0,0,.15);
  }
  input, textarea {
    font: inherit; color: inherit;
    border: 1px dashed transparent; background: transparent;
    outline: none; padding: 2px 4px; border-radius: 4px;
  }
  input:hover, textarea:hover, input:focus, textarea:focus { border-color: #9db4f5; background: #f6f9ff; }

  .head { display: flex; align-items: center; gap: 16px; }
  .logo {
    width: 80px; height: 80px; flex: none;
    border: 1px dashed #aaa; border-radius: 8px;
    display: grid; place-items: center;
    font: 12px system-ui, sans-serif; color: var(--muted); text-align: center;
    cursor: pointer; overflow: hidden; background: #fafafa;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  .school { flex: 1; min-width: 0; }
  .school input {
    width: 100%; text-align: center;
    font-size: 26px; font-weight: 700; letter-spacing: .3px;
  }
  .school .sub { font-size: 15px; font-weight: 400; color: #333; }
  .meta {
    display: flex; justify-content: space-between; gap: 12px;
    margin-top: 14px; padding: 8px 0;
    border-top: 2px solid var(--line); border-bottom: 2px solid var(--line);
    font-weight: 700; font-size: 16px;
  }
  .meta label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .meta input { font-weight: 600; }
  .meta .fm input { width: 60px; }
  .meta .time input { width: 90px; }
  .meta .subj { flex: 1; justify-content: flex-end; }
  .meta .subj input { flex: 1; min-width: 0; max-width: 220px; }

  .title { text-align: center; margin: 10px 0 0; }
  .title input { text-align: center; font-weight: 700; font-size: 17px; width: 100%; text-decoration: underline; }

  .qs { margin-top: 14px; }
  .q {
    display: grid; grid-template-columns: 38px 1fr 64px 24px;
    gap: 6px; align-items: start; margin-bottom: 10px;
    break-inside: avoid;
  }
  .q .n { font-weight: 700; padding-top: 4px; }
  .q textarea { width: 100%; resize: none; overflow: hidden; line-height: 1.5; font-size: 16px; }
  .q .marks { text-align: right; font-weight: 600; width: 100%; font-size: 13px; padding-top: 5px; }
  .q .del {
    border: 0; background: none; color: #b33; cursor: pointer; font-size: 18px; padding: 2px;
  }
  .empty { color: var(--muted); text-align: center; font-family: system-ui, sans-serif; padding: 30px 0; }

  dialog { border: 0; border-radius: 12px; padding: 16px; width: min(560px, 92vw); font-family: system-ui, sans-serif; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog textarea {
    width: 100%; height: 240px; border: 1px solid #c4c9d2; background: #fff; padding: 8px; font-size: 14px;
  }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  dialog button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #c4c9d2; background: #fff; cursor: pointer; }
  dialog button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  @media (max-width: 820px) {
    .paper { width: auto; margin: 0; padding: 16px; min-height: 0; box-shadow: none; }
    .school input { font-size: 17px; }
    .meta .subj input { max-width: none; }
    .q { grid-template-columns: 34px 1fr 52px 20px; }
    .meta { flex-wrap: wrap; font-size: 14px; }
    .meta .subj { flex-basis: 100%; justify-content: flex-start; }
    .logo { width: 60px; height: 60px; }
  }
  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    .bar, .del, dialog, .empty { display: none !important; }
    .paper { margin: 0; box-shadow: none; width: 210mm; }
    input, textarea { border: 0 !important; background: transparent !important; }
    .logo { border: 0; background: none; }
    .logo.blank { display: none; }
    .q { grid-template-columns: 38px 1fr 64px; }
    .q .marks:placeholder-shown { visibility: hidden; }
  }
</style>
</head>
<body>

<div class="bar">
  <button class="primary" id="addBtn">+ Question</button>
  <button id="pasteBtn">Paste many</button>
  <button id="printBtn">Print / Save PDF</button>
  <button id="clearBtn">Clear questions</button>
  <span class="hint">Click any text to edit. Everything is saved in this browser.</span>
</div>

<main class="paper" id="paper">
  <div class="head">
    <label class="logo blank" id="logoBox" title="Click to add school logo">
      <span id="logoHint">School<br>Logo</span>
      <img id="logoImg" alt="" hidden>
      <input type="file" id="logoFile" accept="image/*" hidden>
    </label>
    <div class="school">
      <input id="school" placeholder="School Name" value="">
      <input id="sub" class="sub" placeholder="Address / affiliation (optional)" value="">
    </div>
  </div>

  <div class="title"><input id="exam" placeholder="Exam name, e.g. Half Yearly Examination 2026-27 (optional)"></div>

  <div class="meta">
    <label class="fm">FM : <input id="fm" value="80"></label>
    <label class="time">Time : <input id="time" value="2 hrs"></label>
    <label class="subj">Subject : <input id="subject" placeholder="Subject"></label>
  </div>

  <div class="qs" id="qs"></div>
  <div class="empty" id="empty">No questions yet. Use “+ Question” or “Paste many”.</div>
</main>

<dialog id="dlg">
  <p style="margin:0 0 8px">Paste questions, one per line. Leading numbers like “1.”, “Q2-” or “Que 3)” are removed.</p>
  <textarea id="bulk" placeholder="Who lives in a nuclear family?&#10;How many cousins does Cheenu have?"></textarea>
  <div class="row">
    <button id="dlgCancel">Cancel</button>
    <button class="primary" id="dlgAdd">Add</button>
  </div>
</dialog>

<script>
(function () {
  var KEY = "exam_paper_v1";
  var $ = function (id) { return document.getElementById(id); };
  var fields = ["school", "sub", "exam", "fm", "time", "subject"];
  var state = { logo: "", questions: [] };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        state.logo = s.logo || "";
        state.questions = s.questions || [];
        fields.forEach(function (f) { if (s[f] !== undefined) $(f).value = s[f]; });
      }
    } catch (e) {}
  }
  function save() {
    try {
      var s = { logo: state.logo, questions: state.questions };
      fields.forEach(function (f) { s[f] = $(f).value; });
      localStorage.setItem(KEY, JSON.stringify(s));
    } catch (e) {}
  }

  function grow(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }

  function renderLogo() {
    var has = !!state.logo;
    $("logoImg").hidden = !has;
    $("logoHint").hidden = has;
    $("logoBox").classList.toggle("blank", !has);
    if (has) $("logoImg").src = state.logo;
  }

  function renderQuestions() {
    var host = $("qs");
    host.innerHTML = "";
    state.questions.forEach(function (q, i) {
      var row = document.createElement("div");
      row.className = "q";

      var n = document.createElement("div");
      n.className = "n";
      n.textContent = "Q" + (i + 1) + ".";

      var t = document.createElement("textarea");
      t.rows = 1;
      t.value = q.text;
      t.placeholder = "Type the question";
      t.addEventListener("input", function () { q.text = t.value; grow(t); save(); });

      var m = document.createElement("input");
      m.className = "marks";
      m.placeholder = "marks";
      m.value = q.marks || "";
      m.addEventListener("input", function () { q.marks = m.value; save(); });

      var d = document.createElement("button");
      d.className = "del";
      d.title = "Delete";
      d.textContent = "×";
      d.addEventListener("click", function () {
        state.questions.splice(i, 1);
        save(); renderQuestions();
      });

      row.append(n, t, m, d);
      host.appendChild(row);
      grow(t);
    });
    $("empty").hidden = state.questions.length > 0;
  }

  function addQuestions(list) {
    list.forEach(function (text) { state.questions.push({ text: text, marks: "" }); });
    save(); renderQuestions();
    var all = document.querySelectorAll(".q textarea");
    if (all.length) all[all.length - 1].focus();
  }

  var NUM = /^\s*(?:que(?:s|stion)?\.?\s*)?q?\s*\d+\s*[\.\):\-–]*\s*/i;

  $("addBtn").addEventListener("click", function () { addQuestions([""]); });
  $("clearBtn").addEventListener("click", function () {
    if (state.questions.length && confirm("Remove all questions?")) {
      state.questions = []; save(); renderQuestions();
    }
  });
  $("printBtn").addEventListener("click", function () { window.print(); });

  $("pasteBtn").addEventListener("click", function () { $("bulk").value = ""; $("dlg").showModal(); $("bulk").focus(); });
  $("dlgCancel").addEventListener("click", function () { $("dlg").close(); });
  $("dlgAdd").addEventListener("click", function () {
    var lines = $("bulk").value.split(/\r?\n/)
      .map(function (l) { return l.replace(NUM, "").trim(); })
      .filter(Boolean);
    $("dlg").close();
    if (lines.length) addQuestions(lines);
  });

  $("logoFile").addEventListener("change", function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { state.logo = r.result; save(); renderLogo(); };
    r.readAsDataURL(f);
  });
  $("logoBox").addEventListener("contextmenu", function (e) {
    if (state.logo) { e.preventDefault(); state.logo = ""; save(); renderLogo(); }
  });

  fields.forEach(function (f) { $(f).addEventListener("input", save); });
  window.addEventListener("beforeprint", function () {
    document.querySelectorAll(".q textarea").forEach(grow);
    document.querySelectorAll(".q .marks").forEach(function (m) {
      m.parentNode.style.gridTemplateColumns = m.value ? "" : "38px 1fr 0 0";
    });
  });

  load(); renderLogo(); renderQuestions();
})();
</script>
</body>
</html>
